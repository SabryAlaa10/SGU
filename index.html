<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>المرشد الأكاديمي الذكي - كلية الحاسبات والمعلومات</title>
<meta name="description" content="مساعد ذكي للإجابة عن أسئلة الطلاب بناءً على دليل الطالب 2024-2025 لكلية الحاسبات والمعلومات - جامعة الصالحية الجديدة.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy-950:#071A33; --navy-900:#0A2647; --navy-800:#144272; --navy-700:#205295;
  --teal-500:#0F9E96; --teal-400:#2CA6A4; --teal-100:#E4F5F4; --amber-500:#C97A1E;
  --ink-900:#101826; --ink-600:#455066; --ink-400:#7C879B;
  --line:#E1E8EF; --bg-app:#EEF3F7; --surface:#FFFFFF; --surface-2:#F7F9FB;
  --shadow-1:0 1px 2px rgba(10,38,71,.06),0 6px 18px -8px rgba(10,38,71,.16);
  --font:'Cairo','Segoe UI',Tahoma,sans-serif;
}
[data-theme="dark"]{
  --bg-app:#060F1E; --surface:#0D1B30; --surface-2:#12233B;
  --ink-900:#EAF1F8; --ink-600:#B7C4D6; --ink-400:#7E8CA3; --line:#1D3250; --teal-100:#0F2E2C;
  --shadow-1:0 1px 2px rgba(0,0,0,.35),0 6px 18px -8px rgba(0,0,0,.55);
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; height:100dvh; display:flex; flex-direction:column; overflow:hidden;
  font-family:var(--font); color:var(--ink-900); background:var(--bg-app);
  transition:background .3s ease,color .3s ease;
}
button{font-family:inherit}
::selection{background:var(--teal-400); color:#fff}

/* ---------- Header ---------- */
.site-header{
  flex:none; display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:10px clamp(12px,3vw,28px); padding-top:max(10px,env(safe-area-inset-top));
  background:var(--surface); border-bottom:1px solid var(--line);
}
.brand{display:flex; align-items:center; gap:12px; min-width:0}
.brand-mark{
  width:40px; height:40px; flex:none; border-radius:11px; display:grid; place-items:center;
  background:linear-gradient(155deg,var(--navy-900),var(--navy-700));
}
.brand-mark svg{width:22px; height:22px}
.brand-text{min-width:0}
.brand-text h1{margin:0; font-size:15.5px; font-weight:700; line-height:1.35; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.brand-text p{margin:0; font-size:12px; color:var(--ink-400); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.header-actions{display:flex; align-items:center; gap:8px; flex:none}
.status{display:flex; align-items:center; gap:7px; font-size:12px; font-weight:600; color:var(--ink-600); padding:0 6px}
.dot-online{width:8px; height:8px; border-radius:50%; background:var(--teal-500); box-shadow:0 0 0 3px rgba(15,158,150,.18)}
.icon-btn{
  height:36px; min-width:36px; padding:0 10px; display:inline-flex; align-items:center; justify-content:center; gap:6px;
  border:1px solid var(--line); background:var(--surface); color:var(--ink-600); border-radius:10px;
  font-size:12.5px; font-weight:600; cursor:pointer; transition:background .15s ease,color .15s ease,border-color .15s ease;
}
.icon-btn:hover{background:var(--surface-2); color:var(--ink-900)}
.icon-btn svg{width:17px; height:17px}
.theme-toggle .icon-moon{display:none}
[data-theme="dark"] .theme-toggle .icon-sun{display:none}
[data-theme="dark"] .theme-toggle .icon-moon{display:block}

/* ---------- Chat layout (fills the whole page) ---------- */
.app{flex:1; min-height:0; display:flex; justify-content:center}
.chat{
  width:100%; max-width:900px; min-height:0; display:flex; flex-direction:column;
  background:var(--surface); border-inline:1px solid var(--line);
}
.messages{
  flex:1; min-height:0; overflow-y:auto; padding:24px clamp(14px,3vw,28px);
  display:flex; flex-direction:column; gap:18px; scroll-behavior:smooth;
}
.messages::-webkit-scrollbar{width:8px}
.messages::-webkit-scrollbar-thumb{background:var(--line); border-radius:8px}

/* ---------- Empty state ---------- */
.empty{margin:auto; width:100%; max-width:640px; text-align:center; padding:12px 0}
.empty-mark{
  width:64px; height:64px; margin:0 auto 18px; border-radius:18px; display:grid; place-items:center;
  background:linear-gradient(155deg,var(--navy-800),var(--navy-950)); box-shadow:var(--shadow-1);
}
.empty-mark svg{width:34px; height:34px}
.empty h2{margin:0 0 8px; font-size:clamp(20px,3vw,26px); font-weight:700}
.empty p{margin:0 auto; max-width:480px; font-size:14px; line-height:1.9; color:var(--ink-600)}
.suggestions{display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:26px; text-align:right}
.suggestion{
  display:flex; flex-direction:column; gap:3px; padding:13px 15px; cursor:pointer;
  background:var(--surface-2); border:1px solid var(--line); border-radius:14px; color:inherit;
  transition:border-color .15s ease,transform .15s ease,box-shadow .15s ease; text-align:right;
}
.suggestion:hover{border-color:var(--teal-500); transform:translateY(-2px); box-shadow:var(--shadow-1)}
.suggestion b{font-size:12px; font-weight:700; color:var(--teal-500)}
.suggestion span{font-size:13.5px; font-weight:500; line-height:1.6; color:var(--ink-900)}

/* ---------- Messages ---------- */
.msg{display:flex; gap:10px; align-items:flex-start; max-width:88%; animation:rise .3s ease both}
@keyframes rise{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
.msg.bot{align-self:flex-start}
.msg.user{align-self:flex-end; flex-direction:row-reverse}
.avatar{
  width:32px; height:32px; flex:none; border-radius:10px; display:grid; place-items:center;
  font-size:10.5px; font-weight:700; color:#fff; letter-spacing:.3px;
}
.msg.bot .avatar{background:linear-gradient(155deg,var(--navy-800),var(--navy-950))}
.msg.user .avatar{background:linear-gradient(155deg,var(--teal-400),var(--teal-500))}
.bubble{padding:11px 15px; border-radius:14px; font-size:14.5px; line-height:1.9; min-width:0; overflow-wrap:anywhere}
.msg.bot .bubble{background:var(--surface-2); border:1px solid var(--line); border-top-right-radius:4px}
.msg.user .bubble{background:linear-gradient(155deg,var(--navy-800),var(--navy-900)); color:#F4F9FB; border-top-left-radius:4px}
.bubble p{margin:0 0 8px}
.bubble p:last-child{margin-bottom:0}
.bubble ul{margin:6px 0; padding-inline-start:20px}
.bubble li{margin:3px 0}
.bubble code{font-size:12.5px; background:rgba(15,158,150,.12); padding:1px 5px; border-radius:5px; direction:ltr; unicode-bidi:embed}
.src-tag{display:inline-block; margin-top:8px; font-size:11px; font-weight:700; color:var(--teal-500)}

.feedback{display:flex; align-items:center; gap:6px; margin-top:10px; padding-top:8px; border-top:1px solid var(--line); font-size:12px; color:var(--ink-400)}
.fb-btn{
  width:30px; height:28px; display:grid; place-items:center; border:1px solid var(--line); background:var(--surface);
  color:var(--ink-600); border-radius:8px; cursor:pointer; transition:background .15s ease,color .15s ease,border-color .15s ease;
}
.fb-btn svg{width:15px; height:15px}
.fb-btn:hover:not(:disabled){background:var(--teal-100); color:var(--teal-500); border-color:var(--teal-500)}
.fb-btn:disabled{cursor:default; opacity:.4}
.fb-btn.picked{opacity:1; color:var(--teal-500); border-color:var(--teal-500); background:var(--teal-100)}
.fb-thanks{color:var(--teal-500); font-weight:600}

.typing .bubble{display:flex; gap:4px; padding:15px 16px}
.typing .dot{width:6px; height:6px; border-radius:50%; background:var(--ink-400); animation:bounce 1.2s infinite ease-in-out}
.typing .dot:nth-child(2){animation-delay:.15s}
.typing .dot:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0); opacity:.5} 30%{transform:translateY(-5px); opacity:1}}
.error-banner{
  align-self:center; font-size:13px; color:var(--amber-500); background:rgba(201,122,30,.1);
  border:1px solid rgba(201,122,30,.3); padding:9px 14px; border-radius:10px; max-width:90%; text-align:center;
}

/* ---------- Composer ---------- */
.composer{flex:none; padding:10px clamp(14px,3vw,28px) max(10px,env(safe-area-inset-bottom)); background:var(--surface); border-top:1px solid var(--line)}
.input-wrap{
  display:flex; align-items:flex-end; gap:8px; padding:7px 8px 7px 7px; background:var(--surface-2);
  border:1px solid var(--line); border-radius:16px; transition:border-color .2s ease,box-shadow .2s ease;
}
.input-wrap:focus-within{border-color:var(--teal-500); box-shadow:0 0 0 3px rgba(15,158,150,.15); background:var(--surface)}
.input-wrap textarea{
  flex:1; resize:none; max-height:120px; min-height:40px; border:none; outline:none; background:transparent;
  padding:9px 10px; font:15px/1.6 var(--font); color:var(--ink-900);
}
.input-wrap textarea::placeholder{color:var(--ink-400)}
.send-btn{
  width:40px; height:40px; flex:none; border:none; border-radius:11px; cursor:pointer; color:#fff;
  display:grid; place-items:center; background:linear-gradient(155deg,var(--teal-400),var(--teal-500));
  transition:transform .15s ease,opacity .2s ease;
}
.send-btn:hover:not(:disabled){transform:translateY(-1px)}
.send-btn:disabled{opacity:.45; cursor:not-allowed}
.send-btn svg{width:18px; height:18px; transform:scaleX(-1)}
.fineprint{margin:8px 4px 0; text-align:center; font-size:11.5px; line-height:1.8; color:var(--ink-400)}

button:focus-visible,textarea:focus-visible{outline:2px solid var(--teal-500); outline-offset:2px}
@media (max-width:640px){
  .chat{border-inline:none}
  .suggestions{grid-template-columns:1fr}
  .msg{max-width:96%}
  .status span,.clear-btn span{display:none}
  .brand-text p{display:none}
}
@media (prefers-reduced-motion:reduce){
  .msg,.typing .dot{animation:none !important}
  .messages{scroll-behavior:auto}
}
</style>
</head>
<body>

<header class="site-header">
  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9l10-5 10 5-10 5L2 9Z"/><path d="M6 11.5V16c0 1.4 2.7 3 6 3s6-1.6 6-3v-4.5"/><path d="M22 9v6"/></svg>
    </div>
    <div class="brand-text">
      <h1>المرشد الأكاديمي الذكي</h1>
      <p>كلية الحاسبات والمعلومات · جامعة الصالحية الجديدة</p>
    </div>
  </div>
  <div class="header-actions">
    <div class="status"><span class="dot-online"></span><span>متصل</span></div>
    <button class="icon-btn clear-btn" id="clearBtn" type="button" title="محادثة جديدة">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      <span>محادثة جديدة</span>
    </button>
    <button class="icon-btn theme-toggle" id="themeToggle" type="button" aria-label="تبديل الوضع الليلي" title="الوضع الليلي / النهاري">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.6A9 9 0 1 1 11.4 3 7 7 0 0 0 21 12.6Z"/></svg>
    </button>
  </div>
</header>

<div class="app">
  <section class="chat" id="chatCard" aria-label="المحادثة">
    <div class="messages" id="messages" role="log" aria-live="polite"></div>

    <div class="composer">
      <div class="input-wrap">
        <textarea id="userInput" rows="1" placeholder="اكتب سؤالك هنا…" aria-label="رسالة"></textarea>
        <button class="send-btn" id="sendBtn" type="button" aria-label="إرسال">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4 20-7Z"/></svg>
        </button>
      </div>
      <p class="fineprint">المعلومات استرشادية ومأخوذة من دليل الطالب 2024-2025 وقد تتغير الجداول واللوائح، وللقرارات الأكاديمية راجع المرشد الأكاديمي أو شئون الطلاب. المحادثات بتتسجل لتحسين الخدمة، فمتكتبش بيانات شخصية.</p>
    </div>
  </section>
</div>

<script>
/* ===== الإعدادات ===== */
const N8N_WEBHOOK_URL   = "https://saleh11666.app.n8n.cloud/webhook/sgu-chat";    // Production URL بتاع /webhook/sgu-chat
const N8N_FEEDBACK_URL  = "https://saleh11666.app.n8n.cloud/webhook/sgu-feedback";   // Production URL بتاع /webhook/sgu-feedback
const API_KEY = "";                                  // نفس القيمة اللي في node الـ Guard (سيبها فاضية لو مش مفعّل)
const REQUEST_TIMEOUT_MS = 60000;
const MAX_SAVED = 60;

const SUGGESTIONS = [
  { t: 'التخصصات',        q: 'إيه التخصصات المتاحة في الكلية؟' },
  { t: 'الساعات المعتمدة', q: 'كام ساعة معتمدة لازم أخلصها للتخرج؟' },
  { t: 'اختيار التخصص',   q: 'إمتى بختار التخصص؟' },
  { t: 'المقررات',        q: 'إيه المتطلب السابق لمادة التعلم العميق؟' }
];

const isPlaceholder = u => !u || u.startsWith('YOUR_');
const authHeaders = () => Object.assign({ 'Content-Type': 'application/json' }, API_KEY ? { 'x-api-key': API_KEY } : {});

/* ===== تخزين آمن في المتصفح ===== */
const store = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};

/* ===== الوضع الليلي ===== */
const root = document.documentElement;
{ const t = store.get('sgu-chat-theme'); if (t) root.setAttribute('data-theme', t); }
document.getElementById('themeToggle').addEventListener('click', () => {
  const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  store.set('sgu-chat-theme', next);
});

const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('userInput');
const sendBtn = document.getElementById('sendBtn');

inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});
inputEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendMessage(); }
});

/* ===== Markdown خفيف ===== */
function inlineMd(s){ return s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/`(.+?)`/g,'<code>$1</code>'); }
function renderMarkdown(text){
  const lines = String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').split('\n');
  let html = '', inList = false;
  for (const raw of lines) {
    const line = raw.trim();
    if (/^[-*•]\s+/.test(line)) {
      if (!inList) { html += '<ul>'; inList = true; }
      html += `<li>${inlineMd(line.replace(/^[-*•]\s+/,''))}</li>`;
    } else {
      if (inList) { html += '</ul>'; inList = false; }
      if (line) html += `<p>${inlineMd(line)}</p>`;
    }
  }
  if (inList) html += '</ul>';
  return html || '<p></p>';
}
function scrollToBottom(){ messagesEl.scrollTo({ top: messagesEl.scrollHeight, behavior: 'smooth' }); }

/* ===== الجلسة وسجل المحادثة (بيفضل بعد الريفريش) ===== */
function newSessionId(){ return 'sess_' + Math.random().toString(36).slice(2) + Date.now(); }
function getSessionId(){
  let id = store.get('sgu-chat-session');
  if (!id) { id = newSessionId(); store.set('sgu-chat-session', id); }
  return id;
}
let history = [];
try { history = JSON.parse(store.get('sgu-chat-history') || '[]'); } catch(e){ history = []; }
if (!Array.isArray(history)) history = [];
function saveHistory(){ history = history.slice(-MAX_SAVED); store.set('sgu-chat-history', JSON.stringify(history)); }

/* ===== الشاشة الافتتاحية ===== */
function showEmpty(){
  const el = document.createElement('div');
  el.className = 'empty';
  el.id = 'emptyState';
  el.innerHTML = `
    <div class="empty-mark"><svg viewBox="0 0 24 24" fill="none" stroke="#EAF7F6" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9l10-5 10 5-10 5L2 9Z"/><path d="M6 11.5V16c0 1.4 2.7 3 6 3s6-1.6 6-3v-4.5"/><path d="M22 9v6"/></svg></div>
    <h2>إزاي أقدر أساعدك؟</h2>
    <p>اسألني عن التخصصات، المقررات والمتطلبات السابقة، الخطة الدراسية، الجداول، فرص العمل، والخدمات الطلابية.</p>
    <div class="suggestions"></div>`;
  const grid = el.querySelector('.suggestions');
  SUGGESTIONS.forEach(s => {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'suggestion';
    const t = document.createElement('b'); t.textContent = s.t;
    const q = document.createElement('span'); q.textContent = s.q;
    b.append(t, q);
    b.addEventListener('click', () => sendMessage(s.q));
    grid.appendChild(b);
  });
  messagesEl.appendChild(el);
}
function removeEmpty(){ const e = document.getElementById('emptyState'); if (e) e.remove(); }

/* ===== رسم الرسائل ===== */
const ICON_UP = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10v12M15 5.88 14 10h5.83a2 2 0 0 1 1.92 2.56l-2.33 8A2 2 0 0 1 17.5 22H4a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2h2.76a2 2 0 0 0 1.79-1.11L12 2a3.13 3.13 0 0 1 3 3.88Z"/></svg>';
const ICON_DOWN = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 14V2M9 18.12 10 14H4.17a2 2 0 0 1-1.92-2.56l2.33-8A2 2 0 0 1 6.5 2H20a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-2.76a2 2 0 0 0-1.79 1.11L12 22a3.13 3.13 0 0 1-3-3.88Z"/></svg>';

function renderMessage(m){
  removeEmpty();
  const w = document.createElement('div');
  w.className = `msg ${m.role}`;
  const av = document.createElement('div');
  av.className = 'avatar';
  av.textContent = m.role === 'bot' ? 'SGU' : 'أنت';
  const b = document.createElement('div');
  b.className = 'bubble';
  b.innerHTML = renderMarkdown(m.text);
  if (m.source) {
    const s = document.createElement('span');
    s.className = 'src-tag';
    s.textContent = m.source;
    b.appendChild(s);
  }
  if (m.role === 'bot' && m.id) b.appendChild(buildFeedback(m));
  w.append(av, b);
  messagesEl.appendChild(w);
  scrollToBottom();
}

function buildFeedback(m){
  const row = document.createElement('div');
  row.className = 'feedback';
  const label = document.createElement('span');
  label.textContent = 'الرد ده مفيد؟';
  const up = document.createElement('button');
  const down = document.createElement('button');
  up.type = down.type = 'button';
  up.className = down.className = 'fb-btn';
  up.innerHTML = ICON_UP; down.innerHTML = ICON_DOWN;
  up.setAttribute('aria-label', 'مفيد'); down.setAttribute('aria-label', 'غير مفيد');
  row.append(label, up, down);

  const lock = rating => {
    up.disabled = down.disabled = true;
    (rating === 'up' ? up : down).classList.add('picked');
    label.textContent = 'شكراً على رأيك';
    label.className = 'fb-thanks';
  };
  if (m.rating) lock(m.rating);

  const rate = rating => {
    if (m.rating) return;
    m.rating = rating;
    saveHistory();
    lock(rating);
    sendFeedback(m, rating);
  };
  up.addEventListener('click', () => rate('up'));
  down.addEventListener('click', () => rate('down'));
  return row;
}

async function sendFeedback(m, rating){
  if (isPlaceholder(N8N_FEEDBACK_URL)) return;
  try {
    await fetch(N8N_FEEDBACK_URL, {
      method: 'POST', headers: authHeaders(),
      body: JSON.stringify({ messageId: m.id, sessionId: getSessionId(), rating, question: m.question || '', answer: m.text })
    });
  } catch(e){ console.warn('feedback failed', e); }
}

let typingEl = null;
function showTyping(){
  typingEl = document.createElement('div');
  typingEl.className = 'msg bot typing';
  typingEl.innerHTML = '<div class="avatar">SGU</div><div class="bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>';
  messagesEl.appendChild(typingEl);
  scrollToBottom();
}
function hideTyping(){ if (typingEl) { typingEl.remove(); typingEl = null; } }
function showError(t){
  const el = document.createElement('div');
  el.className = 'error-banner';
  el.textContent = t;
  messagesEl.appendChild(el);
  scrollToBottom();
}

/* ===== n8n Webhook =====
   الطلب: POST { message, sessionId, timestamp }
   الرد:  { reply, messageId } */
function normalize(data){
  if (typeof data === 'string') return { text: data, id: null };
  const p = Array.isArray(data) ? data[0] : data;
  return {
    text: p?.reply ?? p?.output ?? p?.text ?? p?.message ?? 'مفيش رد من المساعد.',
    id: p?.messageId ? String(p.messageId) : null
  };
}
async function callWebhook(message){
  if (isPlaceholder(N8N_WEBHOOK_URL)) {
    await new Promise(r => setTimeout(r, 900));
    return { text: '**وضع تجريبي:** حط رابط الـ webhook بتاع n8n في المتغير `N8N_WEBHOOK_URL` عشان تاخد ردود حقيقية.', id: 'demo_' + Date.now() };
  }
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), REQUEST_TIMEOUT_MS);
  try {
    const res = await fetch(N8N_WEBHOOK_URL, {
      method: 'POST', headers: authHeaders(),
      body: JSON.stringify({ message, sessionId: getSessionId(), timestamp: new Date().toISOString() }),
      signal: ctrl.signal
    });
    if (!res.ok) throw new Error('status ' + res.status);
    const raw = await res.text();
    if (!raw.trim()) return { text: 'الـ webhook رجّع رد فاضي. راجع مخرجات الـ workflow في n8n.', id: null };
    try { return normalize(JSON.parse(raw)); } catch { return { text: raw, id: null }; }
  } finally { clearTimeout(timer); }
}

function setBusy(b){ sendBtn.disabled = b; inputEl.disabled = b; if (!b) inputEl.focus(); }

async function sendMessage(preset){
  const text = (preset ?? inputEl.value).trim();
  if (!text || sendBtn.disabled) return;
  const um = { role:'user', text };
  history.push(um); saveHistory();
  renderMessage(um);
  inputEl.value = ''; inputEl.style.height = 'auto';
  setBusy(true); showTyping();
  try {
    const r = await callWebhook(text);
    hideTyping();
    const bm = { role:'bot', text: r.text, id: r.id, question: text };
    history.push(bm); saveHistory();
    renderMessage(bm);
  } catch (err) {
    hideTyping();
    console.error(err);
    showError(err.name === 'AbortError'
      ? 'المساعد اتأخر في الرد. جرّب تاني بعد شوية.'
      : 'حصلت مشكلة في الاتصال بالمساعد. اتأكد من النت وجرّب تاني.');
  } finally { setBusy(false); }
}

/* ===== التشغيل ===== */
sendBtn.addEventListener('click', () => sendMessage());
document.getElementById('clearBtn').addEventListener('click', () => {
  history = []; store.del('sgu-chat-history');
  store.set('sgu-chat-session', newSessionId());   // جلسة جديدة = ذاكرة جديدة في n8n
  messagesEl.innerHTML = '';
  showEmpty();
});

if (history.length) history.forEach(renderMessage); else showEmpty();
</script>
